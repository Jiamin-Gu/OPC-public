[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-cli"
version = "0.1.0"
description = "A tiny command-line todo list backed by a single JSON file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "todo-cli authors" }]
keywords = ["todo", "cli", "json"]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]

[project.scripts]
todo = "todo_cli.cli:main"

[tool.setuptools]
packages = ["todo_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
