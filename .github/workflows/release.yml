# 发布流水线（CD）：推送版本标签（v1.2.3）时自动 测试 → 检查版本 → 打包 → 冒烟测试 → 创建 GitHub Release。
# 试跑：推送 v1.2.3-rc.1 这样的标签，发布成"预发布"，确认没问题后在网页上删掉；
#       或者在 Actions 页面手动运行（只检查和打包，不发布，安装包在运行结果里下载）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 要写权限（只给这个流水线）

jobs:
  test:
    uses: ./.github/workflows/tests.yml   # 和 CI 跑同样的全部测试，不通过就不往下走

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 检查版本（标签、代码里的版本号、CHANGELOG 一致）
        id: check
        run: python scripts/release_check.py "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: 打包
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist

      - name: 冒烟测试（全新虚拟环境里装好安装包，确认能用）
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && OPC_EMBED_BACKEND=none PATH="/tmp/smoke/bin:$PATH" /tmp/smoke/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

      - name: 保存安装包（手动试跑时在运行结果里下载）
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

      - name: 创建 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" dist/* \
            --title "${{ steps.check.outputs.tag }}" \
            --notes-file release_notes.md \
            ${{ steps.check.outputs.prerelease == 'true' && '--prerelease' || '--latest' }}
